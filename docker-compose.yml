services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tddh_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./Backend/data:/app/data
      - ./Backend/exports:/app/exports
      - ./Backend/uploads:/app/uploads
    env_file:
      - ./Backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - HOST=0.0.0.0
    networks:
      - tddh_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tddh_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tddh_network

networks:
  tddh_network:
    driver: bridge
